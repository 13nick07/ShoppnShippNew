<svg width="220" height="160" viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Rectangle -->
  <rect x="40" y="20" width="100" height="100" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>

  <!-- Width -->
  <line x1="40" y1="130" x2="140" y2="130" stroke="#374151" stroke-width="2"/>
  <text x="90" y="145" text-anchor="middle" font-size="12" fill="#374151">40 cm</text>

  <!-- Height -->
  <line x1="150" y1="20" x2="150" y2="120" stroke="#374151" stroke-width="2"/>
  <text x="155" y="75" font-size="12" fill="#374151">60 cm</text>

  <!-- Depth label -->
  <text x="90" y="15" text-anchor="middle" font-size="12" fill="#374151">
    Depth: 40 cm
  </text>
</svg>