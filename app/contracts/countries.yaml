openapi: 3.0.3
info:
  title: Countries API
  version: 1.0.0
  description: API for managing countries and their cities

servers:
  - url: http://localhost:3000
    description: Local Development Server

tags:
  - name: Countries
    description: Country management endpoints

paths:
  /api/countries:
    get:
      tags:
        - Countries
      summary: Get all countries
      responses:
        '200':
          description: List of countries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesResponse'

    post:
      tags:
        - Countries
      summary: Create a new country
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryInput'
      responses:
        '201':
          description: Country created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryResponse'
        '400':
          description: Validation error

  /api/countries/{id}:
    get:
      tags:
        - Countries
      summary: Get country by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the country
      responses:
        '200':
          description: Country found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryResponse'
        '404':
          description: Country not found

    put:
      tags:
        - Countries
      summary: Update a country
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryInput'
      responses:
        '200':
          description: Country updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryResponse'
        '404':
          description: Country not found
        '400':
          description: Validation error

    delete:
      tags:
        - Countries
      summary: Delete a country
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Country deleted successfully
        '404':
          description: Country not found

components:
  schemas:

    Country:
      type: object
      properties:
        _id:
          type: string
          example: 65f7b0c6a3b4f00012345678
        name:
          type: string
          example: United States
        flag:
          type: string
          example: 🇺🇸
        code:
          type: string
          example: US
        cities:
          type: array
          items:
            type: string
          example:
            - New York
            - Los Angeles
            - Miami
        description:
          type: string
          example: Access to all major US retailers and e-commerce platforms
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CountryInput:
      type: object
      required:
        - name
        - flag
        - code
      properties:
        name:
          type: string
          example: United States
        flag:
          type: string
          example: 🇺🇸
        code:
          type: string
          example: US
        cities:
          type: array
          items:
            type: string
          example:
            - New York
            - Los Angeles
            - Miami
        description:
          type: string
          example: Access to all major US retailers and e-commerce platforms

    CountryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Country'

    CountriesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Country'